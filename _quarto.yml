bibliography: ["assets/modeling.bib", "assets/packages.bib"]
csl: 'assets/apa-single-spaced.csl'

format:
  html:
    theme:
      # Now a light/dark pair instead of one fixed theme — Quarto auto-adds
      # a toggle button in the navbar. Both use the same custom scss on top.
      light:
        - flatly
        - "assets/theme_corrected.scss"
      dark:
        - darkly
        - "assets/theme_corrected.scss"
    css: ["assets/sticky-notes.css", "assets/table-styles.css", "assets/webex.css"]
    # NEW: 'mainfont: Crimson Text' below only sets which font-family CSS
    # points to — it doesn't fetch the font file. There was no <link>/@import
    # loading Crimson Text anywhere in the repo, so it's likely been quietly
    # falling back to a generic system serif for every reader this whole time.
    # This actually loads it.
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    include-after-body: assets/webex.js
    code-copy: true
    highlight-style: default
    mainfont: 'Crimson Text'
    fontsize: '14pt'
    linestretch: '1.5em'
    linkcolor: '#20a2a3' 
    toc: false
    link-external-newwindow: true
editor: source
filters:
 - webr
 - shinylive
 
 
resources:
  - widget.html
  - widget-script.js 
  

